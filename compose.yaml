name: rs-nextcloud-harness

x-probe-environment: &probe-environment
  NC_URL: http://nextcloud
  NC_USER: ${NC_USER:-rstest}
  NC_PASS: ${NC_PASS:-rstest-pass}

services:
  nextcloud:
    image: ${NC_IMAGE:-nextcloud:35-apache}
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: "nc.localhost app.localhost nextcloud origin localhost 127.0.0.1"
    ports:
      - "${NC_PORT:-8080}:80"
    volumes:
      - nextcloud-data:/var/www/html

  origin:
    image: caddy:2-alpine
    ports:
      - "${ORIGIN_PORT:-8081}:80"
    volumes:
      - ./origin/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./origin:/srv:ro

  curl-probe:
    build: ./docker/curl-probe
    image: rs-nc-curl-probe
    working_dir: /harness
    command: ["sleep", "infinity"]
    environment: *probe-environment
    volumes:
      - ./:/harness

  runner:
    build:
      context: ./runner
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.63.0}
    image: rs-nc-runner
    working_dir: /harness/runner
    command: ["sleep", "infinity"]
    shm_size: "1gb"
    environment:
      <<: *probe-environment
      ORIGIN_URL: http://origin
      RESULTS_DIR: /harness/results
      HOME: /tmp
      VARIANT: ${VARIANT:-unknown}
      NC_VERSION: ${NC_VERSION:-unknown}
    volumes:
      - ./results:/harness/results
      # explore/PLAN-explore.md browser specs: under /harness/runner so
      # @playwright/test resolves; sessions are writable evidence.
      - ./explore/browser:/harness/runner/explore:ro
      - ./explore/sessions:/harness/explore/sessions

  # Shares the runner's network namespace and forwards localhost:8081 to "origin":
  # the app only accepts plain-http OAuth redirect URIs on loopback hosts.
  loopback:
    image: caddy:2-alpine
    network_mode: service:runner
    volumes:
      - ./origin/loopback.Caddyfile:/etc/caddy/Caddyfile:ro

  # App origin for browser clients (explore/PLAN-explore.md). Serves the pinned
  # client build; distinct origin per app keeps rs.js localStorage from colliding.
  mfav:
    image: caddy:2-alpine
    volumes:
      - ./origin/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./explore/clients/myfavoritedrinks/checkout:/srv:ro

  # RS Inspektor: Next.js app, built then served with `next start`
  # (explore/clients/inspektor/run.sh builds it).
  inspektor:
    image: node:20-bookworm
    working_dir: /app
    command: ["npx", "next", "start", "-H", "0.0.0.0", "-p", "80"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./explore/clients/inspektor/checkout:/app

  # Upstream RS Inspektor (raucao/inspektor, Ember 2.16): static dist/ with an SPA
  # fallback. The runner reaches it as http://localhost:8082 through "loopback", since
  # the app only accepts plain-http OAuth redirect URIs on loopback hosts.
  inspektor-upstream:
    image: caddy:2-alpine
    volumes:
      - ./explore/clients/inspektor-upstream/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./explore/clients/inspektor-upstream/checkout/dist:/srv:ro

  # One-shot build of the above (Ember CLI 2.16 + node-sass 4.6 need Node 8):
  # `docker compose run --rm inspektor-upstream-build`.
  inspektor-upstream-build:
    image: node:8
    profiles: ["build"]
    working_dir: /app
    environment:
      JOBS: "1"
    command: ["sh", "-c", "npm ci && ./node_modules/.bin/ember build --environment=production"]
    volumes:
      - ./explore/clients/inspektor-upstream/checkout:/app

  # Third-party remoteStorage clients (explore/PLAN-explore.md). Node/PHP;
  # runs on the compose network so `nextcloud` resolves for WebFinger.
  client-probe:
    build: ./docker/client-probe
    image: rs-nc-client-probe
    working_dir: /harness
    command: ["sleep", "infinity"]
    environment: *probe-environment
    volumes:
      - ./:/harness

volumes:
  nextcloud-data:
